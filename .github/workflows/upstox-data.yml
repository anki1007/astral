# Bake NSE history from Upstox into data/nse/*.json.
#
# The terminal is a static page, so it cannot call Upstox itself: Upstox sends
# no CORS header to a browser and its token must never ship in client code.
# The token stays here as a repository secret; this job turns it into static
# JSON that the page fetches same-origin. Same shape as the scanX quotes job.
#
# Weekly is deliberate: this is *history*, and history does not change. The
# only thing that moves is the tail, which a weekly run picks up fine.

name: Upstox NSE history

on:
  schedule:
    # Twice daily, after the NSE close (15:30 IST = 10:00 UTC).
    #
    # GitHub's shared scheduler does not fire on time: the single 11:07 UTC
    # slot was observed landing at 15:00 UTC, four hours late, and the bake
    # itself only ever reached T-1 because the historical endpoint does not
    # return the session that has just closed. Together that left every chart
    # two sessions behind for the whole of each trading day.
    #
    # The script now folds the current session in from the intraday endpoint,
    # so a run right after the close is complete. Two slots rather than one
    # because a dropped or late firing then costs hours, not a day; the
    # concurrency group below stops them overlapping.
    - cron: "37 10 * * 1-5"
    - cron: "23 13 * * 1-5"
  workflow_dispatch:
    inputs:
      stocks:
        description: "NSE symbols to bake, or 'all' for the whole F&O universe"
        required: false
        default: "all"
      intraday:
        description: "Symbols to bake as 5-minute year shards"
        required: false
        default: "NIFTY,BANKNIFTY"

permissions:
  contents: write

concurrency:
  group: astral-upstox-data
  cancel-in-progress: false      # never cancel between commit and push

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the token is present
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            echo "The app keeps working without this — it falls back to Yahoo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Bake candles
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python scripts/fetch_upstox.py --stocks "${{ inputs.stocks || 'all' }}" --intraday "${{ inputs.intraday || 'NIFTY,BANKNIFTY' }}"

      - name: Bake Yahoo dailies (Gold, Silver, commodities, US indices)
        # Public endpoint, no credential. Never fatal: the NSE bake above is
        # what this job is for, and the page falls back to a relay if absent.
        continue-on-error: true
        run: python scripts/fetch_yahoo.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Forward-test log (predict next session, grade past)
        # Logs the engine's forecasts for the next session and the next 30
        # sessions' turn windows, and grades earlier ones against the bars just
        # baked. Committed below, so git timestamps every forecast before its
        # session. Never fatal: the bake is what this job is for.
        continue-on-error: true
        run: node scripts/forward_log.js

      - name: Summarise
        run: |
          echo "### Upstox bake" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("data/nse/_index.json"))
          print(f"Generated `{m['generated']}` from `{m['source']}`\n")
          print("| Instrument | From | To | Bars |")
          print("|---|---|---|---|")
          for k, v in sorted(m["instruments"].items()):
              print(f"| {k} | {v['from']} | {v['to']} | {v['count']} |")
          if m.get("failures"):
              print(f"\n**Failed:** {'; '.join(m['failures'])}")
          PY

      - name: Commit & push
        run: |
          git config user.name  "astral-bot"
          git config user.email "astral@users.noreply.github.com"
          git add data/nse data/yahoo data/forward
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "Refresh NSE history from Upstox [skip ci]"
          # A long bake can run for half an hour, so main may well have moved
          # under it. Rebase and retry rather than throwing the whole run away
          # — only this job writes data/nse, so a rebase applies cleanly.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected — rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || {
              echo "::error::rebase failed"; exit 1; }
          done
          echo "::error::could not push after 5 attempts"; exit 1
